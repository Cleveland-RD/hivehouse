schema_version: "1.1"
name: start-plans-and-waits
tags: [start]
context:
  scaffold_script: scaffold.sh
graders:
  # The marker at the start of an assistant text or after an escaped newline: the skill's own text names it only in
  # backticks, so its loaded instructions in the trace never match (tests/test_evals.sh pins that).
  - name: plan-shown
    type: regex
    target: trace
    pattern: '(?:"text":"|\\n)HM-PLAN:'
  - name: nothing-spawned
    type: tool_used
    tool: Bash
    input_match: 'hm-spawn'
    min: 0
    max: 0
    arm: both
