schema_version: "1.1"
name: start-plans-and-waits
tags: [start]
context:
  scaffold_script: scaffold.sh
graders:
  # The marker at the start of an assistant text or after an escaped newline: the skill's own text names it only in
  # backticks, so its loaded instructions in the trace never match (tests/test_evals.sh pins that).
  - name: plan-shown
    type: regex
    target: trace
    pattern: '(?:"text":"|\\n)HM-PLAN:'
  # A spawn is hm-spawn run as a command (at the start or after a separator, any path before it), never `--self`,
  # which registers the calling session, nor a mention such as `command -v hm-spawn`. tests/test_evals.sh pins both.
  - name: nothing-spawned
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|(]|\\n)\s*)?(?:[^\s"\\;&|]*/)?hm-spawn(?![\w-])(?!(?:[^"\\;&|]|\\.)*--self)'
    min: 0
    max: 0
    arm: both
  # Waits for the owner's OK after the plan: nothing edited, written or sent before it, besides nothing spawned.
  - name: waits-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: waits-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: waits-sendmessage
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
