schema_version: "1.1"
name: start-asks-open-point
tags: [start]
context:
  scaffold_script: scaffold.sh
graders:
  # See start-plans-and-waits/case.yaml for why the marker is matched at a line start in the trace.
  - name: question-marked
    type: regex
    target: trace
    pattern: '(?:"text":"|\\n)HM-CLARIFY:'
  # A spawn is hm-spawn run as a command: at the start, after a separator, a backtick, `{` or the start of a `-c` string,
  # behind assignments or env, timeout, nohup, exec, sudo or xargs, any path before it. Never `--self`, which registers
  # the calling session, nor a mention such as `command -v hm-spawn`. tests/test_evals.sh pins both lists.
  - name: nothing-spawned
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|(&{`]|\\n|-c\s+(?:\\"|'')))?\s*(?:(?:[A-Za-z_]\w*=(?:[^\s"\\]|\\.)*|env|nohup|exec|sudo|xargs|timeout(?:\s+-\S+)*\s+\S+|-\S+)\s+)*(?:[^\s"\\;&|`]*/)?hm-spawn(?![\w-])(?!(?:[^"\\;&|]|\\.)*--self)'
    min: 0
    max: 0
    arm: both
  # The open point is put to the owner, not only marked in the text.
  - name: question-asked
    type: tool_used
    tool: AskUserQuestion
    min: 1
