schema_version: "1.1"
name: start-asks-nothing
tags: [start]
context:
  scaffold_script: scaffold.sh
graders:
  # See start-plans-and-waits/case.yaml for why the markers are matched at a line start in the trace. The plan is
  # required too, so a run that ends before it cannot pass on the question being absent.
  - name: no-question
    type: regex
    target: trace
    pattern: '(?:"text":"|\\n)HM-CLARIFY:'
    match: not_contains
  - name: plan-shown
    type: regex
    target: trace
    pattern: '(?:"text":"|\\n)HM-PLAN:'
  - name: nothing-spawned
    type: tool_used
    tool: Bash
    input_match: 'hm-spawn'
    min: 0
    max: 0
    arm: both
